<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>データ取り込み・出力</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js ライブラリの読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <!-- エラーメッセージ用通知エリア -->
    <div id="status-message" class="status-message hidden"></div>

    <h1>データ取り込み・出力</h1>
    <p class="description">SDカードのログ取り込み、CSV出力、クラウド（Googleスプレッドシート）連携を行います。</p>

    <!-- クラウド連携先 (GAS) -->
    <section class="card">
      <h2>クラウド連携先（Google Apps Script）</h2>
      <p class="card-desc">Google Apps Scriptで発行した「ウェブアプリのURL」を貼り付けてください。どの端末からでも同じデータが見えるようになります。</p>
      <div class="form-group">
        <label for="gas-url">ウェブアプリのURL</label>
        <div class="input-with-button">
          <input type="text" id="gas-url" placeholder="https://script.google.com/macros/s/.../exec">
          <button id="save-sync-btn" class="btn btn-primary">保存して同期</button>
          <span id="sync-status-text" class="status-text"></span>
        </div>
      </div>
    </section>

    <!-- SDカードのログを取り込む -->
    <section class="card">
      <h2>SDカードのログを取り込む（CSV）</h2>
      <p class="card-desc">1行目に見出しがあるCSVを想定しています（例：日時,水温,室温,湿度,気圧）。日付と時刻が別の列でも取り込めます。</p>
      <div class="form-inline">
        <input type="file" id="csv-file-input" accept=".csv">
        <label class="checkbox-label">
          <input type="checkbox" id="thin-out-checkbox" checked>
          1時間ごとに間引く（容量節約）
        </label>
        <button id="import-btn" class="btn btn-dark">取り込む</button>
      </div>
    </section>

    <!-- CSV出力 -->
    <section class="card">
      <h2>CSV出力（発表資料用）</h2>
      <div class="button-group">
        <button id="export-records-btn" class="btn btn-light">記録一覧</button>
        <button id="export-env-btn" class="btn btn-light">環境データ</button>
        <button id="export-water-btn" class="btn btn-light">水質管理表</button>
      </div>
    </section>

    <!-- グラフ描画エリア -->
    <section class="card">
      <h2>データグラフ表示</h2>
      <div class="chart-container" style="position: relative; height:300px;">
        <canvas id="dataChart"></canvas>
      </div>
    </section>
  </div>
</body>
</html>
